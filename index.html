<title>SyanicLauncher</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

<style>
* { box-sizing: border-box; }
img { -webkit-user-drag: none; user-drag: none; }

body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #0c0c0e; color: #eee; font-family: Arial; }
.banner { padding: 11px 20px; background: #17191c; color: #aaa; text-align: center; font-size: 13px; }
main { width: min(1200px, 100%); flex: 1; margin: auto; padding: 70px 30px; display: flex; align-items: center; gap: 65px; }
.content, .preview { flex: 1; min-width: 0; }
h1 { margin: 0 0 12px; font-size: 46px; }
p { max-width: 440px; margin: 0 0 30px; color: #aaa; font-size: 19px; line-height: 1.5; }
.button { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 5px; background: #ff4344; color: white; text-decoration: none; font-size: 16px; }
.button i { font-size: 21px; }
.preview { flex: 1.25; }
.preview img { display: block; width: 100%; border-radius: 5px; }
footer { padding: 22px 20px; color: #777; text-align: center; font-size: 12px; }
footer a { color: #aaa; text-decoration: none; }
footer a:hover { color: #6ca9df; }

@media (max-width: 750px) {
    main { flex-direction: column; align-items: stretch; padding: 55px 22px; gap: 45px; }
    h1 { font-size: 36px; }
    p { font-size: 17px; }
}
</style>

<div class="banner">Note: SyanicLauncher is still <b>under active development.</b></div>

<main>
<section class="content">
	<h1>SyanicLauncher</h1>
	<p>An open-source Minecraft launcher made in India, focused on performance, simplicity, customization and user freedom.</p>
	<a class="button" href="https://github.com/syaniclauncher/syaniclauncher" target="_blank" rel="noopener noreferrer"><i class="ti ti-brand-github"></i>View on GitHub</a>
</section>
<section class="preview">
	<img src="https://raw.githubusercontent.com/syaniclauncher/syaniclauncher/ca0c971dfd26463a12d481520f80d83660b08666/.github/readme-images/old-syaniclauncher.png" alt="SyanicLauncher preview">
</section>
</main>

<footer>© <span id="year">2026</span> <a href="https://github.com/xsyanic">@xsyanic</a> - Not affiliated with Mojang or Microsoft.</footer>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
